name: Build Debian package (bookworm, binaries only)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build binaries (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable emulation so we can run arm64 containers on the amd64 runner
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build inside Debian bookworm (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          docker run --rm --platform=linux/${{ matrix.arch }} \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ARCH=${{ matrix.arch }} \
            -v "$PWD":/work \
            debian:bookworm bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get -y install --no-install-recommends \
                build-essential devscripts dpkg-dev debhelper equivs fakeroot \
                ca-certificates git rsync
              echo "deb-src http://deb.debian.org/debian bookworm main" >> /etc/apt/sources.list
              apt-get update

              # Stage sources so dpkg-buildpackage drops outputs into /work
              mkdir -p /work/src
              rsync -a --delete --exclude out /work/ /work/src/
              cd /work/src

              # Install build-deps from debian/control
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control

              # CI-friendly: skip tests by default (remove if you want tests)
              export DEB_BUILD_OPTIONS="${DEB_BUILD_OPTIONS:-nocheck}"

              # Build binary packages for this arch
              dpkg-buildpackage -us -uc -b

              mkdir -p /work/out/${ARCH}
              mv /work/*.deb /work/out/${ARCH}/
            '

      - name: Upload binaries (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/*.deb
          if-no-files-found: error

